# RawSyst POS, as it runs.
#
# Four services: a database, the API, the worker, and the back office. The till
# is a desktop application and is not here -- it is installed on the counter and
# talks to the API over the network, which is the whole offline-first design.
#
#   docker compose up -d --build                    the whole product
#   make up-small                                   the same, on 8GB
#
# # And four more, in override files, that a small shop does not need
#
#   -f docker-compose.scale.yml     redis + nginx
#   -f docker-compose.files.yml     object storage
#   -f docker-compose.watch.yml     prometheus
#
# They were profiles inside this file until 2026-09-09, and that did not work:
# compose interpolates every `${VAR:?message}` in a file BEFORE it filters by
# profile, so three secrets belonging to services nobody was starting made
# `docker compose up` -- the command this header advertises -- fail outright.
# Profiles cannot fix that; the interpolation happens first. Each add-on now
# lives in the file that declares and validates its own secrets.
#
# What they are for is the deployment where "one server is enough" stops being
# true. A shop with one server, one API and a hundred sales a day needs none of
# them: an in-memory cache is faster than Redis, files in Postgres are simpler
# than a bucket, and the logs are easier to read than a dashboard.
#
# # Migrations run once, before anything that needs them
#
# `migrate` is a one-shot service the API and worker both wait on. Running them
# from the API's own start-up instead would mean two replicas racing to migrate
# the same database on every deploy -- the advisory lock makes that safe and
# still makes it slow and confusing. One service, one run, and the others start
# when it has exited cleanly.
#
# # On the resource limits
#
# They are deliberately present and deliberately modest. A shop's server is
# usually a small VPS, and the failure this prevents is a runaway query in the
# API taking the DATABASE down with it -- at which point the tills cannot sync
# and the shop cannot trade. Better one service degraded than all four.

name: rawsyst

# Every container's log, bounded.
#
# The default json-file driver has NO limit, so a service that logs a line per
# request fills the disk of a shop's server and takes the database down with
# it -- the failure arrives as "no space left on device" from Postgres, which
# points at the wrong thing entirely. Three files of 10MB is 30MB per service
# and about a day of ordinary traffic, which is what an operator actually reads
# back. Anything longer belongs in a log shipper, not on the box.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    logging: *logging
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rawsyst}
      POSTGRES_USER: ${POSTGRES_USER:-rawsyst}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Checksums catch silent corruption on cheap disks, which is the storage
      # a small shop's server actually has. Cannot be turned on later without a
      # dump and reload, so it is on from the first byte.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command:
      # Tuned for a small server rather than left at the defaults, which assume
      # 128MB of shared buffers is generous and that the disk is a spinning one.
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      # An SSD. The default of 4.0 tells the planner random reads are four times
      # the cost of sequential ones, which was true of a disk with a moving arm
      # and makes it avoid indexes it should use.
      - -c
      - random_page_cost=1.1
      # WAL kept for point-in-time recovery. The architecture doc commits to an
      # RPO of 15 minutes through continuous archiving; this is the local half —
      # the archive command belongs to whatever ships the segments off the box.
      - -c
      - wal_level=replica
      - -c
      - max_wal_size=1GB
      # Slow queries, so a table that has outgrown its index is visible before a
      # cashier notices. 500ms is well above anything on the checkout path.
      - -c
      - log_min_duration_statement=500
      # A ceiling on connections, because each one is a process with its own
      # memory and `work_mem` is charged PER SORT, not per server. The default
      # of 100 against work_mem=8MB is a theoretical 800MB of sort memory on a
      # container limited to 1GB -- and the API asks for at most 20, the worker
      # for a handful. 50 leaves room for a migration, a psql session and a
      # backup running at once, and nothing else has any business connecting.
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-50}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # `pg_isready` answers "is the socket up", which is true several seconds
      # before the database will accept a query. The extra SELECT is what makes
      # `service_healthy` mean the API can actually connect.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rawsyst} -d ${POSTGRES_DB:-rawsyst} && psql -U ${POSTGRES_USER:-rawsyst} -d ${POSTGRES_DB:-rawsyst} -c 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1G
    # The database is not published. Only the API reaches it, over the compose
    # network. A Postgres on 5432 of a public interface is found by a scanner
    # within the hour.
    expose:
      - "5432"

  migrate:
    build:
      context: ./backend
      args:
        VERSION: ${VERSION:-dev}
    image: rawsyst/backend:${VERSION:-dev}
    restart: "no"
    entrypoint: ["/migrate"]
    environment: &backend-env
      RAWSYST_ENV: ${RAWSYST_ENV:-production}
      RAWSYST_DATA_REGION: ${RAWSYST_DATA_REGION:-sa}
      RAWSYST_DB_DSN: postgres://${POSTGRES_USER:-rawsyst}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-rawsyst}?sslmode=disable
      RAWSYST_JWT_SECRET: ${RAWSYST_JWT_SECRET:?set RAWSYST_JWT_SECRET in .env}
      RAWSYST_JWT_ISSUER: ${RAWSYST_JWT_ISSUER:-rawsyst-pos}
      RAWSYST_DATA_ENCRYPTION_KEYS: ${RAWSYST_DATA_ENCRYPTION_KEYS:?set RAWSYST_DATA_ENCRYPTION_KEYS in .env}
      RAWSYST_CORS_ORIGINS: ${RAWSYST_CORS_ORIGINS:-}
      # Empty unless the `scale` profile is up. Empty means an in-memory cache,
      # which is correct for one API process and only for one.
      RAWSYST_REDIS_ADDR: ${RAWSYST_REDIS_ADDR:-}
      RAWSYST_REDIS_PASSWORD: ${RAWSYST_REDIS_PASSWORD:-}
      # Empty unless the `files` profile is up. Empty means documents and logos
      # stay in Postgres, which is correct and does not scale.
      RAWSYST_S3_ENDPOINT: ${RAWSYST_S3_ENDPOINT:-}
      RAWSYST_S3_BUCKET: ${RAWSYST_S3_BUCKET:-}
      RAWSYST_S3_REGION: ${RAWSYST_S3_REGION:-us-east-1}
      RAWSYST_S3_ACCESS_KEY_ID: ${RAWSYST_S3_ACCESS_KEY_ID:-}
      RAWSYST_S3_SECRET_ACCESS_KEY: ${RAWSYST_S3_SECRET_ACCESS_KEY:-}
      # The scrape endpoint. Config REFUSES to start outside development with
      # metrics on and no token, so this is required rather than optional.
      RAWSYST_METRICS_ENABLED: ${RAWSYST_METRICS_ENABLED:-true}
      RAWSYST_METRICS_TOKEN: ${RAWSYST_METRICS_TOKEN:?set RAWSYST_METRICS_TOKEN in .env, or set RAWSYST_METRICS_ENABLED=false}
      # Error reporting. Absent means off, which is the default.
      RAWSYST_SENTRY_DSN: ${RAWSYST_SENTRY_DSN:-}
      RAWSYST_SENTRY_SAMPLE_RATE: ${RAWSYST_SENTRY_SAMPLE_RATE:-0.1}
      TZ: ${TZ:-Asia/Riyadh}
    depends_on:
      db:
        condition: service_healthy

  api:
    logging: *logging
    build:
      context: ./backend
      args:
        VERSION: ${VERSION:-dev}
    image: rawsyst/backend:${VERSION:-dev}
    restart: unless-stopped
    entrypoint: ["/api"]
    environment:
      <<: *backend-env
      RAWSYST_HTTP_ADDR: ":8080"
      RAWSYST_DB_MAX_CONNS: ${RAWSYST_DB_MAX_CONNS:-20}
      RAWSYST_DB_MIN_CONNS: ${RAWSYST_DB_MIN_CONNS:-2}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # The image has no shell and no curl, so the check is the binary asking
      # itself. `/readyz` and not `/healthz`: the first says the database
      # answers, the second only says the process is alive — and a process that
      # is alive with no database is exactly what must not receive traffic.
      test: ["CMD", "/api", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
    ports:
      - "${API_PORT:-8080}:8080"

  worker:
    logging: *logging
    build:
      context: ./backend
      args:
        VERSION: ${VERSION:-dev}
    image: rawsyst/backend:${VERSION:-dev}
    restart: unless-stopped
    entrypoint: ["/worker"]
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          # Lower than the API: it processes one job at a time and holds a
          # couple of connections. A worker that can grow to the API's size is
          # a worker that can starve the API.
          memory: 256M

  # The back office.
  #
  # `web-next`, not `web`. This built `web/Dockerfile` until 2026-09-08, which
  # is a two-page shell left over from the first front end -- so a deployment
  # shipped a sign-in and a portal stub while the 137-route product sat in the
  # repository unbuilt. Both directories compile, and a build that succeeds
  # looks like a build that is right, which is why it went unnoticed.
  web:
    logging: *logging
    build:
      context: .
      dockerfile: web-next/Dockerfile
      args:
        # Baked, not passed at runtime: Next freezes its rewrites into the
        # build. See the note in web-next/Dockerfile.
        RAWSYST_API_ORIGIN: ${RAWSYST_API_ORIGIN:-http://api:8080}
    image: rawsyst/web:${VERSION:-dev}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      TZ: ${TZ:-Asia/Riyadh}
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 384M
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  db-data:
