# RawSyst POS, as it runs.
#
# Four services always: a database, the API, the worker, and the back office.
# The till is a desktop application and is not here — it is installed on the
# counter and talks to the API over the network, which is the whole
# offline-first design.
#
# # And four more, behind profiles, that a small shop does not need
#
#   docker compose up --build                        one server, no extras
#   docker compose --profile scale up --build        redis + nginx
#   docker compose --profile files up --build        + object storage
#   docker compose --profile watch up --build        + prometheus
#
# Profiles rather than "always on" because every one of them is genuinely
# optional and the product says so at start-up. A shop with one server, one API
# and a hundred sales a day needs none of them: an in-memory cache is faster
# than Redis, files in Postgres are simpler than a bucket, and the logs are
# easier to read than a dashboard.
#
# What they are for is the deployment where that stops being true:
#
#   - `redis` is what makes a rate limit of ten still be ten behind TWO API
#     replicas, and what makes a revoked permission take effect on both.
#   - `nginx` terminates TLS and puts the API and the back office on one
#     hostname.
#   - `minio` moves a million receipt PDFs out of a database backup.
#   - `prometheus` is what answers "when did it get slow" a week later.
#
#   docker compose up --build
#
# # Migrations run once, before anything that needs them
#
# `migrate` is a one-shot service the API and worker both wait on. Running them
# from the API's own start-up instead would mean two replicas racing to migrate
# the same database on every deploy — the advisory lock makes that safe and
# still makes it slow and confusing. One service, one run, and the others start
# when it has exited cleanly.
#
# # On the resource limits
#
# They are deliberately present and deliberately modest. A shop's server is
# usually a small VPS, and the failure this prevents is a runaway query in the
# API taking the DATABASE down with it — at which point the tills cannot sync
# and the shop cannot trade. Better one service degraded than all four.

name: rawsyst

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rawsyst}
      POSTGRES_USER: ${POSTGRES_USER:-rawsyst}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Checksums catch silent corruption on cheap disks, which is the storage
      # a small shop's server actually has. Cannot be turned on later without a
      # dump and reload, so it is on from the first byte.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command:
      # Tuned for a small server rather than left at the defaults, which assume
      # 128MB of shared buffers is generous and that the disk is a spinning one.
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      # An SSD. The default of 4.0 tells the planner random reads are four times
      # the cost of sequential ones, which was true of a disk with a moving arm
      # and makes it avoid indexes it should use.
      - -c
      - random_page_cost=1.1
      # WAL kept for point-in-time recovery. The architecture doc commits to an
      # RPO of 15 minutes through continuous archiving; this is the local half —
      # the archive command belongs to whatever ships the segments off the box.
      - -c
      - wal_level=replica
      - -c
      - max_wal_size=1GB
      # Slow queries, so a table that has outgrown its index is visible before a
      # cashier notices. 500ms is well above anything on the checkout path.
      - -c
      - log_min_duration_statement=500
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # `pg_isready` answers "is the socket up", which is true several seconds
      # before the database will accept a query. The extra SELECT is what makes
      # `service_healthy` mean the API can actually connect.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rawsyst} -d ${POSTGRES_DB:-rawsyst} && psql -U ${POSTGRES_USER:-rawsyst} -d ${POSTGRES_DB:-rawsyst} -c 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1G
    # The database is not published. Only the API reaches it, over the compose
    # network. A Postgres on 5432 of a public interface is found by a scanner
    # within the hour.
    expose:
      - "5432"

  migrate:
    build:
      context: ./backend
      args:
        VERSION: ${VERSION:-dev}
    image: rawsyst/backend:${VERSION:-dev}
    restart: "no"
    entrypoint: ["/migrate"]
    environment: &backend-env
      RAWSYST_ENV: ${RAWSYST_ENV:-production}
      RAWSYST_DATA_REGION: ${RAWSYST_DATA_REGION:-sa}
      RAWSYST_DB_DSN: postgres://${POSTGRES_USER:-rawsyst}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-rawsyst}?sslmode=disable
      RAWSYST_JWT_SECRET: ${RAWSYST_JWT_SECRET:?set RAWSYST_JWT_SECRET in .env}
      RAWSYST_JWT_ISSUER: ${RAWSYST_JWT_ISSUER:-rawsyst-pos}
      RAWSYST_DATA_ENCRYPTION_KEYS: ${RAWSYST_DATA_ENCRYPTION_KEYS:?set RAWSYST_DATA_ENCRYPTION_KEYS in .env}
      RAWSYST_CORS_ORIGINS: ${RAWSYST_CORS_ORIGINS:-}
      # Empty unless the `scale` profile is up. Empty means an in-memory cache,
      # which is correct for one API process and only for one.
      RAWSYST_REDIS_ADDR: ${RAWSYST_REDIS_ADDR:-}
      RAWSYST_REDIS_PASSWORD: ${RAWSYST_REDIS_PASSWORD:-}
      # Empty unless the `files` profile is up. Empty means documents and logos
      # stay in Postgres, which is correct and does not scale.
      RAWSYST_S3_ENDPOINT: ${RAWSYST_S3_ENDPOINT:-}
      RAWSYST_S3_BUCKET: ${RAWSYST_S3_BUCKET:-}
      RAWSYST_S3_REGION: ${RAWSYST_S3_REGION:-us-east-1}
      RAWSYST_S3_ACCESS_KEY_ID: ${RAWSYST_S3_ACCESS_KEY_ID:-}
      RAWSYST_S3_SECRET_ACCESS_KEY: ${RAWSYST_S3_SECRET_ACCESS_KEY:-}
      # The scrape endpoint. Config REFUSES to start outside development with
      # metrics on and no token, so this is required rather than optional.
      RAWSYST_METRICS_ENABLED: ${RAWSYST_METRICS_ENABLED:-true}
      RAWSYST_METRICS_TOKEN: ${RAWSYST_METRICS_TOKEN:?set RAWSYST_METRICS_TOKEN in .env, or set RAWSYST_METRICS_ENABLED=false}
      # Error reporting. Absent means off, which is the default.
      RAWSYST_SENTRY_DSN: ${RAWSYST_SENTRY_DSN:-}
      RAWSYST_SENTRY_SAMPLE_RATE: ${RAWSYST_SENTRY_SAMPLE_RATE:-0.1}
      TZ: ${TZ:-Asia/Riyadh}
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ./backend
      args:
        VERSION: ${VERSION:-dev}
    image: rawsyst/backend:${VERSION:-dev}
    restart: unless-stopped
    entrypoint: ["/api"]
    environment:
      <<: *backend-env
      RAWSYST_HTTP_ADDR: ":8080"
      RAWSYST_DB_MAX_CONNS: ${RAWSYST_DB_MAX_CONNS:-20}
      RAWSYST_DB_MIN_CONNS: ${RAWSYST_DB_MIN_CONNS:-2}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      # `required: false` so the API starts on its own when the `scale` profile
      # is down. Without it, compose would refuse to bring up a stack that is
      # deliberately not running Redis.
      redis:
        condition: service_healthy
        required: false
    healthcheck:
      # The image has no shell and no curl, so the check is the binary asking
      # itself. `/readyz` and not `/healthz`: the first says the database
      # answers, the second only says the process is alive — and a process that
      # is alive with no database is exactly what must not receive traffic.
      test: ["CMD", "/api", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
    ports:
      - "${API_PORT:-8080}:8080"

  worker:
    build:
      context: ./backend
      args:
        VERSION: ${VERSION:-dev}
    image: rawsyst/backend:${VERSION:-dev}
    restart: unless-stopped
    entrypoint: ["/worker"]
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          # Lower than the API: it processes one job at a time and holds a
          # couple of connections. A worker that can grow to the API's size is
          # a worker that can starve the API.
          memory: 256M

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    image: rawsyst/web:${VERSION:-dev}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      TZ: ${TZ:-Asia/Riyadh}
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 384M
    ports:
      - "${WEB_PORT:-3000}:3000"

  # --- optional: the `scale` profile ---------------------------------------

  redis:
    profiles: ["scale"]
    image: redis:8-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${RAWSYST_REDIS_PASSWORD:?set RAWSYST_REDIS_PASSWORD in .env}
      # No persistence. Everything in here can be recomputed from Postgres by
      # design — see internal/platform/cache — so an AOF would be a backup of
      # something that is already backed up, and a restore would hand the
      # product a stale permission set.
      - --save
      - ""
      - --appendonly
      - "no"
      # A cache with a ceiling and a policy, not a memory leak with a port.
      # Without these, Redis grows until the kernel kills it, and the thing it
      # takes down is the machine the database is on.
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$RAWSYST_REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      RAWSYST_REDIS_PASSWORD: ${RAWSYST_REDIS_PASSWORD}
    deploy:
      resources:
        limits:
          memory: 320M
    # Not published. Only the API and the worker reach it.
    expose:
      - "6379"

  nginx:
    profiles: ["scale"]
    image: nginx:1.29-alpine
    restart: unless-stopped
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/proxy.conf:/etc/nginx/proxy.conf:ro
      - ./deploy/nginx/proxy-ws.conf:/etc/nginx/proxy-ws.conf:ro
      # The certificate, from wherever it is renewed. A self-signed pair is
      # enough to bring the stack up; a real deployment points this at what its
      # ACME client writes.
      - ${TLS_CERT_DIR:-./deploy/nginx/certs}:/etc/nginx/certs:ro
      - certbot-webroot:/var/www/certbot
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 128M
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"

  # --- optional: the `files` profile ----------------------------------------

  minio:
    profiles: ["files"]
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${RAWSYST_S3_ACCESS_KEY_ID:?set RAWSYST_S3_ACCESS_KEY_ID in .env}
      MINIO_ROOT_PASSWORD: ${RAWSYST_S3_SECRET_ACCESS_KEY:?set RAWSYST_S3_SECRET_ACCESS_KEY in .env}
      TZ: ${TZ:-Asia/Riyadh}
    volumes:
      - object-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
    # The console is published; the API reaches the data port over the compose
    # network. Publishing 9000 as well would put an object store holding a
    # shop's documents on a public interface.
    expose:
      - "9000"
    ports:
      - "${MINIO_CONSOLE_PORT:-9001}:9001"

  # --- optional: the `watch` profile ----------------------------------------

  prometheus:
    profiles: ["watch"]
    image: prom/prometheus:latest
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Thirty days. Long enough to answer "when did this start" and short
      # enough that the disk on a shop's server survives it.
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - metrics-data:/prometheus
    environment:
      DEPLOYMENT_NAME: ${DEPLOYMENT_NAME:-rawsyst}
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    # Not published either. A metrics store is read through a dashboard on a
    # private network, not from the internet.
    expose:
      - "9090"

volumes:
  db-data:
  object-data:
  metrics-data:
  certbot-webroot:
