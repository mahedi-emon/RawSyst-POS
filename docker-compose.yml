# RawSyst POS, as it runs.
#
# Four services: a database, the API, the worker, and the back office. The till
# is a desktop application and is not here -- it is installed on the counter and
# talks to the API over the network, which is the whole offline-first design.
#
#   docker compose up -d --build                    the whole product
#   make up-small                                   the same, on 8GB
#
# # And four more, in override files, that a small shop does not need
#
#   -f docker-compose.scale.yml     redis + nginx
#   -f docker-compose.files.yml     object storage
#   -f docker-compose.watch.yml     prometheus
#
# They were profiles inside this file until 2026-09-09, and that did not work:
# compose interpolates every `${VAR:?message}` in a file BEFORE it filters by
# profile, so three secrets belonging to services nobody was starting made
# `docker compose up` -- the command this header advertises -- fail outright.
# Profiles cannot fix that; the interpolation happens first. Each add-on now
# lives in the file that declares and validates its own secrets.
#
# What they are for is the deployment where "one server is enough" stops being
# true. A shop with one server, one API and a hundred sales a day needs none of
# them: an in-memory cache is faster than Redis, files in Postgres are simpler
# than a bucket, and the logs are easier to read than a dashboard.
#
# # Migrations run once, before anything that needs them
#
# `migrate` is a one-shot service the API and worker both wait on. Running them
# from the API's own start-up instead would mean two replicas racing to migrate
# the same database on every deploy -- the advisory lock makes that safe and
# still makes it slow and confusing. One service, one run, and the others start
# when it has exited cleanly.
#
# # On the resource limits
#
# They are deliberately present and deliberately modest. A shop's server is
# usually a small VPS, and the failure this prevents is a runaway query in the
# API taking the DATABASE down with it -- at which point the tills cannot sync
# and the shop cannot trade. Better one service degraded than all four.

name: rawsyst

# Every container's log, bounded.
#
# The default json-file driver has NO limit, so a service that logs a line per
# request fills the disk of a shop's server and takes the database down with
# it -- the failure arrives as "no space left on device" from Postgres, which
# points at the wrong thing entirely. Three files of 10MB is 30MB per service
# and about a day of ordinary traffic, which is what an operator actually reads
# back. Anything longer belongs in a log shipper, not on the box.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    logging: *logging
    # PostgreSQL plus the binary that ships its write-ahead log off the
    # machine, because `archive_command` is a command run INSIDE this
    # container. deploy/postgres/Dockerfile says why that is this product's own
    # binary rather than a shell script with a presigned URL in it.
    build:
      context: .
      dockerfile: deploy/postgres/Dockerfile
      args:
        VERSION: ${VERSION:-dev}
    image: rawsyst/postgres:${VERSION:-dev}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rawsyst}
      POSTGRES_USER: ${POSTGRES_USER:-rawsyst}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}

      # --- the write-ahead log archive -----------------------------------
      #
      # These reach `archive_command`, which inherits the postmaster's
      # environment. They are the ONLY credentials this container holds beyond
      # its own, and they are here rather than handed over a socket from the
      # agent for one reason: archiving must keep working while the agent is
      # restarting. An archiver that stops when another container stops is an
      # archiver that fills this disk during a deploy.
      #
      # Nothing here is ever printed. `rawsyst backup wal archive` says nothing
      # at all on success and prints this product's own sentence on failure;
      # the object store layer never puts a signed URL in an error.
      RAWSYST_S3_ENDPOINT: ${RAWSYST_S3_ENDPOINT:-}
      RAWSYST_S3_BUCKET: ${RAWSYST_S3_BUCKET:-}
      RAWSYST_S3_REGION: ${RAWSYST_S3_REGION:-us-east-1}
      RAWSYST_S3_ACCESS_KEY_ID: ${RAWSYST_S3_ACCESS_KEY_ID:-}
      RAWSYST_S3_SECRET_ACCESS_KEY: ${RAWSYST_S3_SECRET_ACCESS_KEY:-}
      RAWSYST_S3_PATH_STYLE: ${RAWSYST_S3_PATH_STYLE:-true}
      RAWSYST_BACKUP_PREFIX: ${RAWSYST_BACKUP_PREFIX:-rawsyst}
      # The same key the dumps are sealed with. A lost key is a lost archive as
      # well as a lost backup; deploy/server/PITR.md says what that commits you
      # to.
      RAWSYST_BACKUP_ENCRYPTION_KEY: ${RAWSYST_BACKUP_ENCRYPTION_KEY:-}
      RAWSYST_WAL_ARCHIVE_TIMEOUT: ${RAWSYST_WAL_ARCHIVE_TIMEOUT:-2m}
      RAWSYST_WAL_ARCHIVE_RETRIES: ${RAWSYST_WAL_ARCHIVE_RETRIES:-3}
      # Named in the replication line the entrypoint adds to pg_hba.conf.
      RAWSYST_BACKUP_ROLE: ${RAWSYST_BACKUP_ROLE:-rawsyst_backup}
      # Checksums catch silent corruption on cheap disks, which is the storage
      # a small shop's server actually has. Cannot be turned on later without a
      # dump and reload, so it is on from the first byte.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command:
      # Tuned for a small server rather than left at the defaults, which assume
      # 128MB of shared buffers is generous and that the disk is a spinning one.
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      # An SSD. The default of 4.0 tells the planner random reads are four times
      # the cost of sequential ones, which was true of a disk with a moving arm
      # and makes it avoid indexes it should use.
      - -c
      - random_page_cost=1.1
      # --- continuous archiving -------------------------------------------
      #
      # `replica` is the minimum level that writes enough for the log to be
      # replayed somewhere else. `minimal` would make point-in-time recovery
      # impossible and would not say so until somebody tried one.
      - -c
      - wal_level=replica
      - -c
      - max_wal_size=1GB
      #
      # ARCHIVE_MODE IS THE SWITCH. On, with an archive_command that exits
      # non-zero when the upload fails — at which point PostgreSQL KEEPS the
      # segment and retries. That is the safe direction and it has a cost: a
      # store that stays unreachable means pg_wal grows until the disk is full.
      # The agent watches that number every minute and the dashboard goes amber
      # long before it matters. The alternative — an archive_command that
      # succeeded anyway — is a green archive with a hole in it, which nobody
      # finds until a recovery.
      #
      # With no object store configured, `wal archive` refuses immediately and
      # every segment is retained. So a deployment that turns this on without
      # RAWSYST_S3_BUCKET fills its disk: .env.example says so beside both
      # variables, and `rawsyst backup wal preflight` says it in one command.
      #
      # # Why the default here is OFF and .env.example says on
      #
      # Because the two failures are not symmetrical. Archiving on with no
      # bucket fills the disk and the first symptom is Postgres refusing to
      # write — silent until it is an outage. Archiving off is reported RED by
      # `wal status`, RED on the Recovery screen, and refused by name by
      # `wal preflight`.
      #
      # A production server gets `on` from its own `.env`, which is copied from
      # `.env.example`, which sets it and explains it. Somebody running
      # `docker compose up` to look at the product gets `off` and a red light
      # rather than a full disk overnight.
      - -c
      - archive_mode=${POSTGRES_ARCHIVE_MODE:-off}
      - -c
      - archive_command=/rawsyst backup wal archive %p %f
      #
      # How long PostgreSQL waits before closing a partly-filled segment and
      # archiving it. This is the RPO on an idle server, directly: at 60s the
      # most that can be lost is the last minute of trading.
      #
      # It is not free. A forced switch writes a whole 16 MiB segment however
      # little is in it, so an idle night is about 23 GiB of local writes —
      # which compresses to a few kilobytes per segment in the bucket, so the
      # storage and the bandwidth are negligible and the disk writes are not.
      # On a consumer SSD that is decades of endurance; on a cheap VPS with a
      # small disk it is worth raising. Trading hours fill segments on their
      # own and are unaffected either way.
      - -c
      - archive_timeout=${POSTGRES_ARCHIVE_TIMEOUT:-60}
      #
      # Two, because `pg_basebackup --wal-method=stream` opens a second
      # connection to stream the log written while it copies. One would make
      # every base backup fail at the last step.
      - -c
      - max_wal_senders=${POSTGRES_MAX_WAL_SENDERS:-4}
      #
      # Enough log kept locally that a base backup running for an hour does not
      # have its own starting segment recycled out from under it. 1GB is about
      # sixty segments.
      - -c
      - wal_keep_size=${POSTGRES_WAL_KEEP_SIZE:-1GB}
      # Slow queries, so a table that has outgrown its index is visible before a
      # cashier notices. 500ms is well above anything on the checkout path.
      - -c
      - log_min_duration_statement=500
      # A ceiling on connections, because each one is a process with its own
      # memory and `work_mem` is charged PER SORT, not per server. The default
      # of 100 against work_mem=8MB is a theoretical 800MB of sort memory on a
      # container limited to 1GB -- and the API asks for at most 20, the worker
      # for a handful. 50 leaves room for a migration, a psql session and a
      # backup running at once, and nothing else has any business connecting.
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-50}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # `pg_isready` answers "is the socket up", which is true several seconds
      # before the database will accept a query. The extra SELECT is what makes
      # `service_healthy` mean the API can actually connect.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rawsyst} -d ${POSTGRES_DB:-rawsyst} && psql -U ${POSTGRES_USER:-rawsyst} -d ${POSTGRES_DB:-rawsyst} -c 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1G
    # The database is not published. Only the API reaches it, over the compose
    # network. A Postgres on 5432 of a public interface is found by a scanner
    # within the hour.
    expose:
      - "5432"

  migrate:
    build:
      context: ./backend
      # By NAME, because Docker builds the LAST stage when no target is
      # given, and that is the postgres-based `backup` stage. See the
      # comment on `FROM scratch AS runtime` in backend/Dockerfile.
      target: runtime
      args:
        VERSION: ${VERSION:-dev}
    image: rawsyst/backend:${VERSION:-dev}
    restart: "no"
    entrypoint: ["/rawsyst", "migrate"]
    environment: &backend-env
      RAWSYST_ENV: ${RAWSYST_ENV:-production}
      RAWSYST_DATA_REGION: ${RAWSYST_DATA_REGION:-sa}
      RAWSYST_DB_DSN: postgres://${POSTGRES_USER:-rawsyst}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-rawsyst}?sslmode=disable
      RAWSYST_JWT_SECRET: ${RAWSYST_JWT_SECRET:?set RAWSYST_JWT_SECRET in .env}
      RAWSYST_JWT_ISSUER: ${RAWSYST_JWT_ISSUER:-rawsyst-pos}
      RAWSYST_DATA_ENCRYPTION_KEYS: ${RAWSYST_DATA_ENCRYPTION_KEYS:?set RAWSYST_DATA_ENCRYPTION_KEYS in .env}
      RAWSYST_CORS_ORIGINS: ${RAWSYST_CORS_ORIGINS:-}
      # Who administers this deployment. Read by `/bootstrap`, which creates
      # the first platform operator and then refuses for ever.
      RAWSYST_PLATFORM_EMAIL: ${RAWSYST_PLATFORM_EMAIL:-}
      # Empty unless the `scale` profile is up. Empty means an in-memory cache,
      # which is correct for one API process and only for one.
      RAWSYST_REDIS_ADDR: ${RAWSYST_REDIS_ADDR:-}
      RAWSYST_REDIS_PASSWORD: ${RAWSYST_REDIS_PASSWORD:-}
      # What actually reads this today is the BACKUP, and nothing else.
      #
      # Documents, logos and regulatory source documents are `bytea` columns
      # and stay in Postgres whatever is set here — the services that store
      # them write SQL. Setting these does not move a file out of the database,
      # and `docker-compose.files.yml` starting MinIO does not either. Said
      # here because the opposite belief leads somewhere bad: an operator who
      # thinks documents live in the bucket may conclude the database dump is
      # not the whole of the business data. It is.
      RAWSYST_S3_ENDPOINT: ${RAWSYST_S3_ENDPOINT:-}
      RAWSYST_S3_BUCKET: ${RAWSYST_S3_BUCKET:-}
      RAWSYST_S3_REGION: ${RAWSYST_S3_REGION:-us-east-1}
      RAWSYST_S3_ACCESS_KEY_ID: ${RAWSYST_S3_ACCESS_KEY_ID:-}
      RAWSYST_S3_SECRET_ACCESS_KEY: ${RAWSYST_S3_SECRET_ACCESS_KEY:-}
      # The scrape endpoint. Config REFUSES to start outside development with
      # metrics on and no token, so this is required rather than optional.
      RAWSYST_METRICS_ENABLED: ${RAWSYST_METRICS_ENABLED:-true}
      RAWSYST_METRICS_TOKEN: ${RAWSYST_METRICS_TOKEN:?set RAWSYST_METRICS_TOKEN in .env, or set RAWSYST_METRICS_ENABLED=false}
      # Error reporting. Absent means off, which is the default.
      RAWSYST_SENTRY_DSN: ${RAWSYST_SENTRY_DSN:-}
      RAWSYST_SENTRY_SAMPLE_RATE: ${RAWSYST_SENTRY_SAMPLE_RATE:-0.1}
      TZ: ${TZ:-Asia/Riyadh}
    depends_on:
      db:
        condition: service_healthy

  # The first platform operator, and nothing else.
  #
  # A deployment migrates cleanly, comes up healthy, and nobody can sign in: a
  # platform operator is a user with no tenant, and every route that could make
  # one sits behind the guard it would be needed to pass. This closes that, and
  # closes it once -- it refuses if any operator already exists, which is what
  # makes it safe to leave in the file.
  #
  # Behind a profile so `up` never runs it. Run it deliberately, with
  # RAWSYST_PLATFORM_EMAIL set in .env:
  #
  #   docker compose --profile setup run --rm bootstrap
  #
  # It prints a password once and requires it to be changed at first sign-in.
  bootstrap:
    profiles: ["setup"]
    build:
      context: ./backend
      # By NAME, because Docker builds the LAST stage when no target is
      # given, and that is the postgres-based `backup` stage. See the
      # comment on `FROM scratch AS runtime` in backend/Dockerfile.
      target: runtime
      args:
        VERSION: ${VERSION:-dev}
    image: rawsyst/backend:${VERSION:-dev}
    restart: "no"
    entrypoint: ["/rawsyst", "bootstrap"]
    environment:
      <<: *backend-env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # The legal values, from a file.
  #
  # `api` refuses to start while a release-blocking rule is still a placeholder
  # for a market this deployment serves. The screen that could record one is
  # served BY the api, and the image has no shell, so until this existed the
  # only way past that gate was to reach the database from outside the stack.
  #
  # With no arguments it reports what is outstanding and exits non-zero if
  # anything is blocking, which makes it a deployment check:
  #
  #   docker compose --profile setup run --rm regulatory
  #   docker compose --profile setup run --rm regulatory -template -country sa > sources.json
  #   #  somebody reads the articles that file cites and fills in the figures
  #   docker compose --profile setup run --rm regulatory -check -file /sources/sources.json
  #   docker compose --profile setup run --rm regulatory -apply -file /sources/sources.json
  #
  # The file is mounted read-only. This never writes to it, and a container
  # that cannot change the attestation it is applying is one less way for the
  # record of what was attested to drift from what was recorded.
  regulatory:
    profiles: ["setup"]
    build:
      context: ./backend
      # By NAME, because Docker builds the LAST stage when no target is
      # given, and that is the postgres-based `backup` stage. See the
      # comment on `FROM scratch AS runtime` in backend/Dockerfile.
      target: runtime
      args:
        VERSION: ${VERSION:-dev}
    image: rawsyst/backend:${VERSION:-dev}
    restart: "no"
    entrypoint: ["/rawsyst", "regulatory"]
    environment:
      <<: *backend-env
      RAWSYST_REGULATORY_SOURCE: ${RAWSYST_REGULATORY_SOURCE:-}
    volumes:
      - ${RAWSYST_REGULATORY_SOURCE_DIR:-./deploy/regulatory}:/sources:ro
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Retrieve the document a legal value is published in, read it, and record
  # what it says.
  #
  #   docker compose --profile setup run --rm ingest \
  #     -rule SA.EOSB.ENTITLEMENT -from 2005-09-27 -apply -verified you@example
  #
  # Needs an outbound HTTPS route to the authority. Without one, pass -file with
  # the publication mounted under /sources, or use the Super Admin screen; the
  # three service calls behind all three routes are the same ones.
  ingest:
    profiles: ["setup"]
    build:
      context: ./backend
      # By NAME, because Docker builds the LAST stage when no target is
      # given, and that is the postgres-based `backup` stage. See the
      # comment on `FROM scratch AS runtime` in backend/Dockerfile.
      target: runtime
      args:
        VERSION: ${VERSION:-dev}
    image: rawsyst/backend:${VERSION:-dev}
    restart: "no"
    entrypoint: ["/rawsyst", "ingest"]
    environment:
      <<: *backend-env
    volumes:
      - ${RAWSYST_REGULATORY_SOURCE_DIR:-./deploy/regulatory}:/sources:ro
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Backups, on a timer rather than as a resident process.
  #
  #   docker compose --profile backup run --rm backup run
  #   docker compose --profile backup run --rm backup verify
  #   docker compose --profile backup run --rm backup list
  #   docker compose --profile backup run --rm backup prune
  #
  # A daily backup wants to be a timer, not a container that has to be running,
  # watched and kept in memory in order to work for ninety seconds a day.
  # `deploy/server/RUNBOOK.md` has the systemd units.
  #
  # It needs somewhere OFF this machine to put them: RAWSYST_S3_ENDPOINT and a
  # bucket. Without one it refuses rather than writing a backup to the disk it
  # is protecting, which is not a backup.
  backup:
    profiles: ["backup"]
    build:
      context: ./backend
      target: backup
      args:
        VERSION: ${VERSION:-dev}
    image: rawsyst/backup:${VERSION:-dev}
    restart: "no"
    # Anchored here and reused by `backup-agent` below, the same way
    # `&backend-env` is anchored on `migrate`. Two services need all of this and
    # a copy that drifted would mean the nightly timer and the button on the
    # website behaved differently — which is exactly the kind of difference
    # nobody finds until a recovery.
    environment: &backup-env
      <<: *backend-env
      # The role that TAKES the backup. It must be able to read past row-level
      # security and it must NOT be the application's own role, because that
      # attribute is the only thing keeping one business out of another's
      # books. Empty falls back to the application's DSN, which on a correctly
      # configured server cannot dump — and says so before it starts rather
      # than failing partway. deploy/server/BACKUP.md has the four statements.
      RAWSYST_BACKUP_DSN: ${RAWSYST_BACKUP_DSN:-}
      # A connection to a DIFFERENT database on the same server, for the
      # scratch database a verification restores into. Postgres cannot create a
      # database from inside the one being created beside.
      RAWSYST_BACKUP_ADMIN_DSN: ${RAWSYST_BACKUP_ADMIN_DSN:-postgres://${POSTGRES_USER:-rawsyst}:${POSTGRES_PASSWORD}@db:5432/postgres?sslmode=disable}
      RAWSYST_BACKUP_PREFIX: ${RAWSYST_BACKUP_PREFIX:-rawsyst}
      RAWSYST_BACKUP_KEEP_DAILY: ${RAWSYST_BACKUP_KEEP_DAILY:-7}
      RAWSYST_BACKUP_KEEP_WEEKLY: ${RAWSYST_BACKUP_KEEP_WEEKLY:-4}
      RAWSYST_BACKUP_KEEP_MONTHLY: ${RAWSYST_BACKUP_KEEP_MONTHLY:-3}
      RAWSYST_BACKUP_TIMEOUT: ${RAWSYST_BACKUP_TIMEOUT:-30m}
      RAWSYST_BACKUP_TEMP_DIR: /staging
      RAWSYST_BACKUP_STAGING_DIR: /staging
      # Optional, and a lost key is a lost backup — permanently, for everybody
      # on the server. Off by default for that reason;
      # deploy/server/BACKUP.md says what turning it on commits you to.
      RAWSYST_BACKUP_ENCRYPTION_KEY: ${RAWSYST_BACKUP_ENCRYPTION_KEY:-}
      # The most destructive thing this product can do, and off unless a
      # deployment says otherwise in its own environment, where nobody with a
      # browser can change it.
      RAWSYST_ALLOW_PRODUCTION_RESTORE: ${RAWSYST_ALLOW_PRODUCTION_RESTORE:-false}

      # --- point-in-time recovery ------------------------------------------
      #
      # The dumps above are photographs; this is the film. A base backup is a
      # byte-level copy of the cluster, and the write-ahead log is replayed
      # onto it — which is the only way to get back a moment nobody
      # photographed. The agent reads the same bucket and the same key the
      # archiver in the db container writes with.
      #
      # How far back the recovery window reaches. It costs whatever
      # write-ahead log the shop generates in that time, which is a small
      # fraction of what one base backup costs — so this is the cheap dial and
      # KEEP_BASE_BACKUPS is the expensive one.
      RAWSYST_PITR_RETENTION_DAYS: ${RAWSYST_PITR_RETENTION_DAYS:-7}
      # The fewest physical copies kept whatever their age. Two, so that a
      # corrupt newest one does not leave no point-in-time recovery at all on
      # the day it is the thing being used.
      RAWSYST_PITR_KEEP_BASE_BACKUPS: ${RAWSYST_PITR_KEEP_BASE_BACKUPS:-2}
      RAWSYST_PITR_MAX_BASE_BACKUPS: ${RAWSYST_PITR_MAX_BASE_BACKUPS:-8}
      # Bounds on the two long operations. A base backup that hangs holds a
      # replication connection and a staging volume and tells nobody.
      RAWSYST_BASE_BACKUP_TIMEOUT: ${RAWSYST_BASE_BACKUP_TIMEOUT:-2h}
      RAWSYST_PITR_TIMEOUT: ${RAWSYST_PITR_TIMEOUT:-4h}
      # How often the agent takes a reading of the archive: two listings a
      # minute. Turn it down on a metered store.
      RAWSYST_WAL_OBSERVE_INTERVAL: ${RAWSYST_WAL_OBSERVE_INTERVAL:-1m}
      RAWSYST_BACKUP_ROLE: ${RAWSYST_BACKUP_ROLE:-rawsyst_backup}
    volumes:
      # A dump is staged on disk and streamed out; it is never held in memory.
      # Its own volume so a large one cannot fill the container's writable
      # layer, and so the space it needs is visible in `docker system df`.
      - backup-staging:/staging
    depends_on:
      db:
        condition: service_healthy

  # The agent, which is what makes the button on the website do anything.
  #
  # # Why this is a second service and not a flag on the first
  #
  # `backup` is one-shot: the systemd timer runs `backup run`, it exits, and
  # nothing is resident. That is right for a nightly job and it cannot serve a
  # person pressing CREATE BACKUP, because there is nothing listening.
  #
  # So this one stays up and claims work from `backup_task`. It is the same
  # image and the same binary; the difference is that it does not exit.
  #
  # # Why it is not the ordinary worker
  #
  # `pg_dump` and `pg_restore` live in the postgres image. The API and the
  # worker are built from `scratch` and are about twenty megabytes; carrying the
  # PostgreSQL client tools in them to run one command a day would be the wrong
  # trade, and a second drainer of the `job` table would claim ZATCA
  # submissions it cannot run and fail them.
  #
  # # What it costs
  #
  # An idle poll every five seconds against one indexed table. The memory
  # ceiling is small on purpose: this process holds no dump in memory — it
  # stages to disk and streams — so anything above this would be a leak rather
  # than a need.
  backup-agent:
    logging: *logging
    build:
      context: ./backend
      target: backup
      args:
        VERSION: ${VERSION:-dev}
    image: rawsyst/backup:${VERSION:-dev}
    restart: unless-stopped
    entrypoint: ["/rawsyst", "backup", "agent"]
    environment: *backup-env
    volumes:
      - backup-staging:/staging
    deploy:
      resources:
        limits:
          # Raised from 256M when point-in-time recovery arrived, and the
          # reason is worth stating: a recovery starts a SECOND PostgreSQL as a
          # child of this container, so that postmaster's shared buffers and
          # its backends are charged here. The recovered instance is configured
          # with 128MB of shared buffers and twenty connections (see
          # pitrinstance.go), which with the agent's own footprint lands
          # comfortably inside this.
          #
          # An agent that only ever takes dumps does not need it: 256M is still
          # right for a deployment with no object store, where the four
          # point-in-time task kinds refuse anyway.
          memory: ${BACKUP_AGENT_MEMORY:-768M}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  api:
    logging: *logging
    build:
      context: ./backend
      # By NAME, because Docker builds the LAST stage when no target is
      # given, and that is the postgres-based `backup` stage. See the
      # comment on `FROM scratch AS runtime` in backend/Dockerfile.
      target: runtime
      args:
        VERSION: ${VERSION:-dev}
    image: rawsyst/backend:${VERSION:-dev}
    restart: unless-stopped
    entrypoint: ["/rawsyst", "api"]
    environment:
      <<: *backend-env
      RAWSYST_HTTP_ADDR: ":8080"
      RAWSYST_DB_MAX_CONNS: ${RAWSYST_DB_MAX_CONNS:-20}
      RAWSYST_DB_MIN_CONNS: ${RAWSYST_DB_MIN_CONNS:-2}
      RAWSYST_BACKUP_PREFIX: ${RAWSYST_BACKUP_PREFIX:-rawsyst}
      # Where an uploaded backup is written. Shared with the agent, which is
      # what checks it: the API streams the bytes to disk and the agent
      # restores them, and passing a multi-gigabyte file between two processes
      # any other way would mean holding it in memory.
      RAWSYST_BACKUP_STAGING_DIR: /staging
      # Read only to tell the Backup & Recovery screen whether to show the
      # button at all. The agent has the same setting and is where it is
      # actually enforced — a screen is a convenience, never the boundary.
      RAWSYST_ALLOW_PRODUCTION_RESTORE: ${RAWSYST_ALLOW_PRODUCTION_RESTORE:-false}
    volumes:
      # The same volume the agent stages into. An upload arrives here and is
      # verified from here; nothing about it is trusted until it has been
      # restored into a temporary database and compared with its manifest.
      - backup-staging:/staging
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # The image has no shell and no curl, so the check is the binary asking
      # itself. `/readyz` and not `/healthz`: the first says the database
      # answers, the second only says the process is alive — and a process that
      # is alive with no database is exactly what must not receive traffic.
      test: ["CMD", "/rawsyst", "api", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
    ports:
      - "${API_PORT:-8080}:8080"

  worker:
    logging: *logging
    build:
      context: ./backend
      # By NAME, because Docker builds the LAST stage when no target is
      # given, and that is the postgres-based `backup` stage. See the
      # comment on `FROM scratch AS runtime` in backend/Dockerfile.
      target: runtime
      args:
        VERSION: ${VERSION:-dev}
    image: rawsyst/backend:${VERSION:-dev}
    restart: unless-stopped
    entrypoint: ["/rawsyst", "worker"]
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          # Lower than the API: it processes one job at a time and holds a
          # couple of connections. A worker that can grow to the API's size is
          # a worker that can starve the API.
          memory: 256M

  # The back office.
  #
  # `web-next`, not `web`. This built `web/Dockerfile` until 2026-09-08, which
  # is a two-page shell left over from the first front end -- so a deployment
  # shipped a sign-in and a portal stub while the 137-route product sat in the
  # repository unbuilt. Both directories compile, and a build that succeeds
  # looks like a build that is right, which is why it went unnoticed.
  web:
    logging: *logging
    build:
      context: .
      dockerfile: web-next/Dockerfile
      args:
        # Baked, not passed at runtime: Next freezes its rewrites into the
        # build. See the note in web-next/Dockerfile.
        RAWSYST_API_ORIGIN: ${RAWSYST_API_ORIGIN:-http://api:8080}
    image: rawsyst/web:${VERSION:-dev}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      TZ: ${TZ:-Asia/Riyadh}
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 384M
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  backup-staging:
  db-data:
