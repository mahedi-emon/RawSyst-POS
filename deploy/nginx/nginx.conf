# The reverse proxy in front of RawSyst POS.
#
# # What this is for
#
# Three things the Go binary should not be doing:
#
#   1. TLS. A shop's certificate is renewed by something that watches a
#      directory, and reloading a proxy is cheaper than restarting an API that
#      is holding sync sessions from forty tills.
#   2. One address for two services. The back office and the API are separate
#      processes, and a browser that has to know both is a browser with a CORS
#      problem and two hostnames to configure.
#   3. Refusing traffic before it costs anything. A request rejected here has
#      not touched a database connection.
#
# # Not a security boundary
#
# Every rule below is a courtesy. Authentication, tenant isolation, permissions
# and rate limits on the recovery routes are all enforced in the API and are
# enforced there whether or not this file exists — a shop running the API
# directly on a port is a supported deployment. Nothing here may become the
# only thing stopping something.

worker_processes auto;

events {
  # A small shop's server. Raise it for a stack serving many tenants; the
  # binding constraint is almost always the database connection pool rather
  # than this number.
  worker_connections 2048;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # The request id the API generates, so a line in this log and a line in the
  # API's log for the same request can be put side by side. Without it, a 502
  # here and an error there are two events nobody can join.
  log_format rawsyst '$remote_addr $host "$request" $status $body_bytes_sent '
                     '$request_time "$http_referer" "$http_user_agent" '
                     'req=$upstream_http_x_request_id';
  access_log /var/log/nginx/access.log rawsyst;
  error_log  /var/log/nginx/error.log warn;

  sendfile        on;
  tcp_nopush      on;
  keepalive_timeout 65;
  server_tokens   off;

  # Compression for the things that compress. Not for images, and NOT for
  # anything already encrypted — and note that response compression over TLS
  # with a secret in the body is the BREACH shape, which is why the API's JSON
  # error envelopes carry no secrets in the first place.
  gzip              on;
  gzip_vary         on;
  gzip_min_length   1024;
  gzip_proxied      any;
  gzip_types        text/plain text/css text/javascript application/javascript
                    application/json application/manifest+json image/svg+xml;

  # Big enough for a bulk import, small enough that an accidental upload of
  # somebody's holiday photographs is refused here rather than in the API's
  # memory.
  client_max_body_size 32m;
  client_body_timeout  30s;
  client_header_timeout 15s;

  # Set once, here, rather than in proxy.conf. A directive repeated in the same
  # context is an nginx error; set at the http level it is INHERITED, which is
  # what lets the socket location raise its own without conflicting.
  proxy_connect_timeout 5s;
  proxy_send_timeout    60s;
  proxy_read_timeout    60s;

  # Two zones, because the traffic is not the same shape.
  #
  # `api` is generous: a till syncing a day of offline sales makes a burst of
  # legitimate requests and must not be throttled into failing a shift close.
  # `auth` is tight, because the only thing that makes many sign-in attempts
  # from one address is somebody trying passwords.
  #
  # Both are per address and both are a courtesy: the API's own limits are the
  # ones that hold, and they hold when this proxy is not there.
  limit_req_zone $binary_remote_addr zone=api:16m  rate=30r/s;
  limit_req_zone $binary_remote_addr zone=auth:4m  rate=1r/s;
  limit_conn_zone $binary_remote_addr zone=conns:8m;

  upstream rawsyst_api {
    server api:8080 max_fails=3 fail_timeout=10s;
    keepalive 32;
  }

  upstream rawsyst_web {
    server web:3000 max_fails=3 fail_timeout=10s;
    keepalive 16;
  }

  # The WebSocket upgrade, mapped rather than hard-coded.
  #
  # A plain `proxy_set_header Connection "upgrade"` on every request breaks
  # keep-alive for the ordinary ones. This sends "upgrade" only when the client
  # asked for one and "close" otherwise, which is the documented idiom.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Plain HTTP: redirected, except for the ACME challenge that issues the
  # certificate. Serving the product over HTTP would mean a session cookie
  # marked Secure is never sent and every sign-in silently has no session.
  server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS is set by the API on its own responses too. Here as well because
    # the back office's responses come from Next.js, which does not.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    limit_conn conns 64;

    # --- the API ---------------------------------------------------------

    location /api/ {
      limit_req zone=api burst=60 nodelay;
      proxy_pass http://rawsyst_api;
      include /etc/nginx/proxy.conf;
    }

    # Sign-in and password recovery, held to a much tighter rate.
    #
    # A burst of five so somebody mistyping their password twice is not
    # punished, and one a second after that.
    location ~ ^/api/v1/auth/(login|forgot-password|reset-password)$ {
      limit_req zone=auth burst=5 nodelay;
      proxy_pass http://rawsyst_api;
      include /etc/nginx/proxy.conf;
    }

    # The live socket. Long-lived by definition and not rate-limited: a till
    # holds ONE of these for a whole shift, so a limit here would only ever
    # punish a shop reconnecting after its internet came back.
    location /api/v1/live {
      proxy_pass http://rawsyst_api;
      # Its own include, not proxy.conf plus overrides. See proxy-ws.conf.
      include /etc/nginx/proxy-ws.conf;
    }

    # Health checks: proxied, unlogged. They are a third of the access log
    # otherwise and say nothing.
    location = /healthz {
      access_log off;
      proxy_pass http://rawsyst_api;
      include /etc/nginx/proxy.conf;
    }

    location = /readyz {
      access_log off;
      proxy_pass http://rawsyst_api;
      include /etc/nginx/proxy.conf;
    }

    # The scrape endpoint is NOT published here.
    #
    # It carries a description of how much business every shop on this stack is
    # doing. The API guards it with a bearer token as well, and this is the
    # second lock: Prometheus reaches the API over the internal network, and
    # nothing outside can ask at all.
    location = /metrics {
      return 404;
    }

    # --- the back office --------------------------------------------------

    location / {
      proxy_pass http://rawsyst_web;
      include /etc/nginx/proxy.conf;
    }
  }
}
