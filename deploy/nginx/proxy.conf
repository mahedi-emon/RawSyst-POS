# The headers every ORDINARY proxied location sets.
#
# Included rather than repeated, because a header set in five of six places is
# a bug in the sixth.
#
# The WebSocket location includes `proxy-ws.conf` instead and not this file.
# The two cannot be combined: `proxy_set_header Connection` appears in both
# with different values, and nginx treats repeated `proxy_set_header` in one
# context as a LIST rather than an override — the upstream would receive two
# Connection headers and the upgrade would fail.

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

# Emptied, not passed through. `Connection` is a hop-by-hop header, and
# forwarding the client's would break keep-alive to the upstream.
proxy_set_header Connection "";

# The API's own limiter reads RemoteAddr and never X-Forwarded-For, because a
# header a client sets is a limiter a client defeats by changing it. That means
# the address the API sees is THIS proxy's, and its per-caller limit becomes a
# global one — which is why the rate zones in nginx.conf exist and are keyed on
# the client address.
#
# The forwarded headers are still set: they are what the access log and any
# audit trail behind it need in order to say where a request came from.

# A dead upstream is retried on another one rather than handed to the client as
# a 502. `non_idempotent` is deliberately NOT included: retrying a POST that may
# already have been applied is how a customer gets charged twice, and the API's
# own idempotency keys are what make a retry safe when the CLIENT chooses it.
proxy_next_upstream error timeout http_502 http_503 http_504;
proxy_next_upstream_tries 2;
