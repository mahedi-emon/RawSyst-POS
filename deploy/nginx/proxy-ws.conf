# The WebSocket location's headers and timeouts.
#
# A separate file rather than `proxy.conf` plus overrides, because nginx treats
# repeated `proxy_set_header` in one context as a list: including both would
# send the upstream `Connection: ""` AND `Connection: upgrade`, and the
# handshake would fail in a way that looks like a network problem.

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

# The upgrade itself. `$connection_upgrade` is mapped in nginx.conf so this
# says "upgrade" only when the client asked for one.
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# An hour, not a minute. The socket is meant to stay open for a shift, and a
# till can sit quiet between customers for a long time; the socket's own ping
# every twenty seconds is what notices a dead peer. A proxy that closed a quiet
# connection after sixty seconds would have every till reconnecting all day.
proxy_connect_timeout 5s;
proxy_read_timeout  3600s;
proxy_send_timeout  3600s;

# Off, or a push waits in a buffer for the next one — which for a stock delta
# means the thing it exists to prevent.
proxy_buffering off;
