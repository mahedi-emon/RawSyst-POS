[package]
name = "rawsyst-pos"
version = "0.1.0"
description = "RawSyst POS terminal"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Production builds carry no development affordances. Listed explicitly so a
# release cannot pick one up by accident.
default = []
