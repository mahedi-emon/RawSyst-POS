# An S3-compatible object store on this machine.
#
#   docker compose -f docker-compose.yml -f docker-compose.files.yml up -d
#
# WHAT THIS IS FOR TODAY: somewhere for BACKUPS to go on a deployment with no
# external object store. `backup run` refuses to write to the disk it is
# protecting, so a single-machine deployment needs one of these or a bucket
# somewhere else.
#
# WHAT IT IS NOT: this does not move documents out of Postgres. An earlier
# version of this comment said it did. Documents, company logos and regulatory
# source documents are `bytea` columns — `document.bytes`, `company_logo.bytes`,
# `regulatory_source_document.content` — and the services that write them write
# SQL. The API opens the object store, pings it, logs that it connected, and
# hands it to nothing but the backup.
#
# The distinction matters for recovery rather than for tidiness: because every
# file is in the database, the database dump IS the whole of the business data,
# and `backup verify` is therefore a complete check. On the day files do move
# out, this volume stops being only somewhere backups are kept and becomes
# something that needs backing up itself. deploy/server/BACKUP.md is where that
# has to be written down when it happens.
#
# See the note on override files in docker-compose.scale.yml.
#
# Needs, in .env:
#   RAWSYST_S3_ACCESS_KEY_ID
#   RAWSYST_S3_SECRET_ACCESS_KEY

name: rawsyst

# Every container's log, bounded. The same block as the base file, repeated
# because a YAML anchor does not cross files.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  minio:
    logging: *logging
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${RAWSYST_S3_ACCESS_KEY_ID:?set RAWSYST_S3_ACCESS_KEY_ID in .env}
      MINIO_ROOT_PASSWORD: ${RAWSYST_S3_SECRET_ACCESS_KEY:?set RAWSYST_S3_SECRET_ACCESS_KEY in .env}
      TZ: ${TZ:-Asia/Riyadh}
    volumes:
      - object-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
    # The console is published; the API reaches the data port over the compose
    # network. Publishing 9000 as well would put an object store holding a
    # shop's documents on a public interface.
    expose:
      - "9000"
    ports:
      - "${MINIO_CONSOLE_PORT:-9001}:9001"

volumes:
  object-data:
