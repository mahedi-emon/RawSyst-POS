# A million receipt PDFs out of the database backup.
#
#   docker compose -f docker-compose.yml -f docker-compose.files.yml up -d
#
# Without it documents and logos stay in Postgres, which is correct for a shop
# and does not scale. See the note on override files in
# docker-compose.scale.yml.
#
# Needs, in .env:
#   RAWSYST_S3_ACCESS_KEY_ID
#   RAWSYST_S3_SECRET_ACCESS_KEY

name: rawsyst

# Every container's log, bounded. The same block as the base file, repeated
# because a YAML anchor does not cross files.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  minio:
    logging: *logging
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${RAWSYST_S3_ACCESS_KEY_ID:?set RAWSYST_S3_ACCESS_KEY_ID in .env}
      MINIO_ROOT_PASSWORD: ${RAWSYST_S3_SECRET_ACCESS_KEY:?set RAWSYST_S3_SECRET_ACCESS_KEY in .env}
      TZ: ${TZ:-Asia/Riyadh}
    volumes:
      - object-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
    # The console is published; the API reaches the data port over the compose
    # network. Publishing 9000 as well would put an object store holding a
    # shop's documents on a public interface.
    expose:
      - "9000"
    ports:
      - "${MINIO_CONSOLE_PORT:-9001}:9001"

volumes:
  object-data:
