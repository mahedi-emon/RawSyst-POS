name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Run CI against the current tip of a branch on demand.
  #
  # GitHub's "Re-run jobs" button replays a run against the SAME commit it
  # originally ran on, so re-running an old failure keeps failing however many
  # times it is clicked — it is still testing the old code. This gives a way to
  # check the latest commit without pushing an empty one.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 1.26.6 carries the fixes for four stdlib advisories (crypto/tls, net/http,
  # encoding/xml, encoding/asn1) that govulncheck reports against 1.26.5.
  # Pinned in one place so the compiler cannot drift between jobs.
  GO_VERSION: '1.26.6'

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      # The container's own POSTGRES_USER is created as a SUPERUSER, and a
      # superuser ignores row-level security entirely — FORCE ROW LEVEL SECURITY
      # only covers the table owner, not a superuser. Connecting the application
      # as one gives a run with no tenant isolation at all, silently, while
      # every policy still sits in the catalogue looking correct.
      #
      # So the container keeps `postgres` for administration, and the step below
      # creates the unprivileged role the application actually uses. That
      # mirrors production, which is the only environment worth testing against.
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Verify formatting
        run: make fmt-check

      - name: Vet
        run: make vet

      # Blueprint A1 forbids claiming certification we do not have. This is a
      # legal exposure, so it fails the build rather than raising a warning.
      #
      # Runs from backend/ like every other step: the Makefile lives there, and
      # the linter takes the repository root as its argument. An earlier version
      # overrode working-directory to the repo root, where there is no Makefile,
      # and failed every run with exit code 2.
      - name: Compliance wording check
        run: make lint-wording

      - name: Unit tests
        run: make test

      # Deliberately NOSUPERUSER NOBYPASSRLS, matching production. Without this
      # the isolation tests run against a connection that ignores every policy,
      # which is worse than not running them: they would pass by accident once
      # someone "fixed" them to match the broken environment.
      - name: Create the unprivileged application role
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 <<'SQL'
            CREATE ROLE rawsyst WITH LOGIN PASSWORD 'rawsyst'
              NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
            CREATE DATABASE rawsyst_test OWNER rawsyst ENCODING 'UTF8';
          SQL
          echo "--- confirming the role cannot bypass RLS ---"
          psql -h localhost -U postgres -tAc \
            "SELECT rolname || ' super=' || rolsuper || ' bypassrls=' || rolbypassrls
             FROM pg_roles WHERE rolname='rawsyst';"

      - name: Migrations and database-backed tests
        env:
          RAWSYST_ENV: development
          RAWSYST_DB_DSN: postgres://rawsyst:rawsyst@localhost:5432/rawsyst_test?sslmode=disable
          RAWSYST_JWT_SECRET: ci-only-secret-value-at-least-32-bytes-long
        run: |
          go run ./cmd/migrate
          # Re-running must be a no-op. If it is not, a migration is not
          # idempotent and a redeploy would break a live database.
          go run ./cmd/migrate
          make test-db

  frontends:
    name: Front ends
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # One install for the whole workspace. `npm ci` rather than `npm install`
      # so a lockfile that has drifted from package.json fails here rather than
      # resolving to something nobody has run locally.
      - name: Install
        run: npm ci

      # Types first. A type error makes the test failures that follow it
      # unreadable, and every package is checked because `shared` is consumed by
      # all of the others and a break there surfaces in them.
      #
      # `web-next` is the product. It was missing from this list for as long as
      # it has existed, so CI could be green while the back office — 137 routes
      # and every screen the Blueprint asks for — did not compile. `web` is the
      # frozen two-page shell it replaced and is still checked, because frozen
      # is not deleted.
      - name: Typecheck
        run: |
          npm run typecheck --workspace shared
          npm run typecheck --workspace pos
          npm run typecheck --workspace web
          npm run typecheck --workspace web-next

      - name: Shared tests
        run: npm test --workspace shared

      - name: POS tests
        run: npm test --workspace pos

      - name: Back office tests
        run: npm test --workspace web-next

      # The contract is GENERATED from the Go router, the entitlement table and
      # the seeded permission catalogue. Checking it here is what stops the
      # front end and the API drifting apart between the commit that adds a
      # route and the one that calls it: `--check` regenerates and fails if the
      # committed file differs.
      - name: API contract is current
        run: npm run check:contract --workspace web-next

      # Every route the Go table declares is called by a screen, reached
      # through a helper, or exempted with a reason. A capability that exists
      # and cannot be reached is a promise the product does not keep, and it is
      # invisible to every other check here.
      - name: Route reachability
        run: npm run check:reach --workspace web-next

      # The builds are part of the gate, not a formality: `vite build` and
      # `next build` both do work that neither the typechecker nor the tests do
      # — module resolution across the workspace, and Next's own route and
      # server-component checks — and either can fail on green tests.
      - name: POS build
        run: npm run build --workspace pos

      - name: Frozen shell build
        run: npm run build --workspace web

      # `next build` does work neither the typechecker nor the tests do: route
      # collection, server-component checks, and the standalone trace the
      # container image is assembled from. It can fail on green tests.
      - name: Back office build
        run: npm run build --workspace web-next

      # The gate that decides whether an installer may be cut. Run here in its
      # reporting form so the state is visible on every commit: today it says
      # the icon is a placeholder and there is no certificate, which is true and
      # is the point. It does not fail the build, because a red CI for a known
      # and accepted condition is a CI nobody reads.
      - name: Release readiness
        continue-on-error: true
        run: npm run release:check --workspace pos

  security:
    name: Security scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      # govulncheck reports only advisories reachable from this code's call
      # paths, so a finding is exploitable here rather than merely present
      # somewhere in the dependency graph. That makes failing the build the
      # right response for a system holding tax records.
      - name: Vulnerability scan
        run: make vuln
