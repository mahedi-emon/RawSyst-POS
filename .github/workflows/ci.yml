name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 1.26.6 carries the fixes for four stdlib advisories (crypto/tls, net/http,
  # encoding/xml, encoding/asn1) that govulncheck reports against 1.26.5.
  # Pinned in one place so the compiler cannot drift between jobs.
  GO_VERSION: '1.26.6'

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: rawsyst
          POSTGRES_PASSWORD: rawsyst
          POSTGRES_DB: rawsyst_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rawsyst"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Verify formatting
        run: make fmt-check

      - name: Vet
        run: make vet

      # Blueprint A1 forbids claiming certification we do not have. This is a
      # legal exposure, so it fails the build rather than raising a warning.
      #
      # Runs from backend/ like every other step: the Makefile lives there, and
      # the linter takes the repository root as its argument. An earlier version
      # overrode working-directory to the repo root, where there is no Makefile,
      # and failed every run with exit code 2.
      - name: Compliance wording check
        run: make lint-wording

      - name: Unit tests
        run: make test

      - name: Migrations and database-backed tests
        env:
          RAWSYST_ENV: development
          RAWSYST_DB_DSN: postgres://rawsyst:rawsyst@localhost:5432/rawsyst_test?sslmode=disable
          RAWSYST_JWT_SECRET: ci-only-secret-value-at-least-32-bytes-long
        run: |
          go run ./cmd/migrate
          # Re-running must be a no-op. If it is not, a migration is not
          # idempotent and a redeploy would break a live database.
          go run ./cmd/migrate
          make test-db

  security:
    name: Security scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      # govulncheck reports only advisories reachable from this code's call
      # paths, so a finding is exploitable here rather than merely present
      # somewhere in the dependency graph. That makes failing the build the
      # right response for a system holding tax records.
      - name: Vulnerability scan
        run: make vuln
