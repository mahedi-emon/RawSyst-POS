name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: rawsyst
          POSTGRES_PASSWORD: rawsyst
          POSTGRES_DB: rawsyst_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rawsyst"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: backend/go.sum

      - name: Verify formatting
        run: make fmt-check

      - name: Vet
        run: make vet

      # Blueprint A1 forbids claiming certification we do not have. This is a
      # legal exposure, so it fails the build rather than raising a warning.
      - name: Compliance wording check
        run: make lint-wording
        working-directory: .

      - name: Unit tests
        run: make test

      - name: Migrations and database-backed tests
        env:
          RAWSYST_ENV: development
          RAWSYST_DB_DSN: postgres://rawsyst:rawsyst@localhost:5432/rawsyst_test?sslmode=disable
          RAWSYST_JWT_SECRET: ci-only-secret-value-at-least-32-bytes-long
        run: |
          go run ./cmd/migrate
          # Re-running must be a no-op. If it is not, a migration is not
          # idempotent and a redeploy would break a live database.
          go run ./cmd/migrate
          make test-db

  security:
    name: Security scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: backend/go.sum
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
